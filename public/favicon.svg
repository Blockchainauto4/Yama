<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Subtle glow inner ring -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.15"/>

  <!-- Shopping Cart Base & Wheels in White/Yellow -->
  <!-- Cart body outline -->
  <path d="M16 19 L23 19 L28 37 L48 37 L52 24 L22 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Cart Wheels -->
  <circle cx="30" cy="43" r="3" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="46" cy="43" r="3" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="1"/>

  <!-- Stylized Bold "Y" inside the cart with Discount Flame/Sparkle -->
  <!-- Left stem of Y -->
  <path d="M29 27 L36 34 L43 27" fill="none" stroke="url(#accentGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Base of Y -->
  <path d="M36 34 L36 38" fill="none" stroke="url(#accentGrad)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Top Right Promo Sparkle / Star -->
  <path d="M49 11 L50.5 15 L54.5 16.5 L50.5 18 L49 22 L47.5 18 L43.5 16.5 L47.5 15 Z" fill="url(#accentGrad)" filter="url(#shadow)"/>
  <circle cx="49" cy="16.5" r="1" fill="#FFFFFF"/>
</svg>
